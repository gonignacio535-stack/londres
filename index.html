<style>
/* Layout: mapa esquemático fijo (izquierda en escritorio, arriba en móvil) + itinerario dibujado como una línea de metro */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --fg:#17212B; --muted:#5A6672; --rule:#D7DDE4; --chip:#E8ECF0;
  --land:#E8ECF0; --river:#B3CDE4; --park:#CFE2C7; --grid:#D9DFE5; --road:#FFFFFF;
  --gold:#B07414; --gold-soft:#F6E6C4; --gold-ink:#6E4508; --on-line:#FFFFFF; --focus:#2C67AA;
  --d1:#C4413A; --d2:#2C67AA; --d3:#7646AE; --d4:#1C8466; --d5:#C2691A;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#151D26; --fg:#E5EAF0; --muted:#94A1AF; --rule:#283442; --chip:#1F2833;
    --land:#121A23; --river:#1C3954; --park:#183023; --grid:#1B2530; --road:#2B3846;
    --gold:#E2AE4A; --gold-soft:#3A2E17; --gold-ink:#F1CF86; --on-line:#0E141B; --focus:#6FA4E2;
    --d1:#E86A61; --d2:#5E99DC; --d3:#A47FDB; --d4:#3EBB95; --d5:#E69C50;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#151D26; --fg:#E5EAF0; --muted:#94A1AF; --rule:#283442; --chip:#1F2833;
  --land:#121A23; --river:#1C3954; --park:#183023; --grid:#1B2530; --road:#2B3846;
  --gold:#E2AE4A; --gold-soft:#3A2E17; --gold-ink:#F1CF86; --on-line:#0E141B; --focus:#6FA4E2;
  --d1:#E86A61; --d2:#5E99DC; --d3:#A47FDB; --d4:#3EBB95; --d5:#E69C50;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
.wrap{max-width:1280px; margin:0 auto; padding-block:20px 48px}

header.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 24px; padding-bottom:14px}
.top .dates{font-family:var(--f-mono); font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
.top h1{font-family:var(--f-display); font-weight:400; font-size:clamp(36px, 6vw, 56px); line-height:1; margin:0; letter-spacing:-.01em; text-wrap:balance}
.top .home{margin:8px 0 0; color:var(--muted)}
.count{font-family:var(--f-mono); font-size:13px; border:1px solid var(--rule); background:var(--surface); border-radius:999px; padding:6px 12px; white-space:nowrap}

.layout{display:grid; gap:18px; grid-template-columns:minmax(0, 1fr)}
.panel{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding-block:8px; display:flex; flex-direction:column; gap:10px; min-width:0}
.tabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; font:600 13px/1 var(--f-body); color:var(--fg); background:var(--surface); border:1px solid var(--rule); border-radius:999px; padding:9px 13px; cursor:pointer}
.tab .dot{width:10px; height:10px; border-radius:50%; background:var(--c)}
.tab[aria-current="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.tab:hover{border-color:var(--fg)}
.mapbox{position:relative; display:flex; flex-direction:column; min-height:0}
.map{position:relative; z-index:0; height:42vh; height:42svh; min-height:240px; border:1px solid var(--rule); border-radius:12px; overflow:hidden; background:var(--land); transition:height .25s ease}

        '<a href="#" role="button" data-tool="fit" title="Volver a encuadrar" aria-label="Volver a encuadrar">' + ICON_FIT + '</a>' +
        '<a href="#" role="button" data-tool="loc" title="Dónde estoy" aria-label="Mostrar dónde estoy">' + ICON_LOC + '</a>' +
        '<a href="#" role="button" data-tool="big" class="tool-big" title="Agrandar el mapa" aria-label="Agrandar el mapa" aria-pressed="false">' + ICON_BIG + '</a>';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      L.DomEvent.on(div, "click", function(e){
        var a = e.target.closest ? e.target.closest("[data-tool]") : null;
        L.DomEvent.preventDefault(e);
        if (a) tool(a.getAttribute("data-tool"), a);
      });
      return div;
    }
  });
  new Tools().addTo(map);
  routes = L.layerGroup().addTo(map);
  marks = L.layerGroup().addTo(map);
  map.on("zoomend", function(){ el.classList.toggle("z-hi", map.getZoom() >= 14); el.classList.toggle("z-lo", map.getZoom() < 12.5); });
  map.on("locationfound", function(e){
    if (here) map.removeLayer(here);
    here = L.layerGroup([
      L.circle(e.latlng, {radius: Math.min(e.accuracy, 300), className: "here-acc", weight: 1, interactive: false}),
      L.circleMarker(e.latlng, {radius: 7, className: "here-dot", weight: 3, fillOpacity: 1}).bindTooltip("Estáis aquí", {direction: "top", offset: [0, -8], className: "tip"})
    ]).addTo(map);
  });
  map.on("locationerror", function(){ toast("No se ha podido ver dónde estás. Da permiso de ubicación al navegador y vuelve a probar."); });
  setTiles();
  try{
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", setTiles); else if (mq.addListener) mq.addListener(setTiles);
  }catch(e){}
  if (window.MutationObserver) new MutationObserver(setTiles).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
  if (window.ResizeObserver) new ResizeObserver(function(){ map.invalidateSize({pan: false}); }).observe(el);
}

var toastTimer = 0;
function toast(msg){
  var t = document.getElementById("maptoast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 4500);
}
function tool(name, a){
  if (!map) return;
  if (name === "fit"){ fitView(true); return; }
  if (name === "loc"){ map.locate({setView: true, maxZoom: 16, enableHighAccuracy: true, timeout: 10000}); return; }
  if (name === "big"){
    var el = document.getElementById("map"), on = !el.classList.contains("big");
    el.classList.toggle("big", on);
    a.setAttribute("aria-pressed", String(on));
    a.title = on ? "Reducir el mapa" : "Agrandar el mapa";
    a.setAttribute("aria-label", a.title);
    setTimeout(function(){ map.invalidateSize({pan: false}); }, 60);
  }
}

function viewBounds(){
  var pts = [];
  (state.view === "todo" ? DAYS : [dayById(state.view)]).forEach(function(d){
    d.stops.forEach(function(s){ if (!s.off) pts.push([s.lat, s.lon]); });
  });
  return L.latLngBounds(pts);
}
function fitView(animate){
  if (!map) return;
  var narrow = window.innerWidth < 600, pad = narrow ? [22, 22] : [44, 44];
  var opts = {paddingTopLeft: pad, paddingBottomRight: [pad[0] + (narrow ? 0 : 30), pad[1]], maxZoom: 16};
  if (animate && !reduce){ opts.duration = 0.6; map.flyToBounds(viewBounds(), opts); }
  else { opts.animate = false; map.fitBounds(viewBounds(), opts); }
}
function focusStop(s){
  if (!map || !s) return;
  var ll = L.latLng(s.lat, s.lon);
  if (s.off){ if (reduce) map.setView(ll, 11); else map.flyTo(ll, 11, {duration: 0.6}); return; }
  if (!map.getBounds().pad(-0.15).contains(ll)) map.panTo(ll, {animate: !reduce});
}

function pinIcon(s, full){
  var c = "var(" + s.day.c + ")", isDone = done.indexOf(s.id) >= 0, act = state.active === s.id;
  if (!full) return L.divIcon({className: "pin dot" + (s.xmas ? " xmas" : ""), html: '<span style="--c:' + c + '"></span>', iconSize: [14, 14]});
  var sz = act ? 34 : 26;
  var cls = "pin" + (s.xmas ? " xmas" : "") + (s.alt ? " alt" : "") + (isDone && !s.alt ? " done" : "") + (act ? " active" : "");
  return L.divIcon({className: cls, html: '<span style="--c:' + c + '">' + (isDone && !s.alt ? "✓" : s.num) + '</span>', iconSize: [sz, sz]});
}
function draw(){
  if (!map) return;
  routes.clearLayers(); marks.clearLayers();
  var full = state.view !== "todo", days = full ? [dayById(state.view)] : DAYS;
  days.forEach(function(d){
    var prev = null;
    d.stops.forEach(function(s){
      if (s.alt) return;
      if (prev && !(prev.lat === s.lat && prev.lon === s.lon)){
        var m = s.leg ? s.leg.m : "pie", solid = (m === "metro" || m === "tren");
        var w = full ? (solid ? 5 : 3.5) : (solid ? 3 : 2);
        var ll = [[prev.lat, prev.lon], [s.lat, s.lon]], far = (s.off || prev.off) ? " far" : "";
        L.polyline(ll, {className: "rt-case" + far, weight: w + 3, opacity: 1, interactive: false}).addTo(routes);
        L.polyline(ll, {className: "rt " + d.id + far, weight: w, opacity: 1, dashArray: solid ? null : "6 7", interactive: false}).addTo(routes);
      }
      prev = s;
    });
  });
  L.marker([CASA.lat, CASA.lon], {icon: L.divIcon({className: "pin home", html: "<span>" + HOUSE + "</span>", iconSize: [26, 26]}), keyboard: false, zIndexOffset: -100, title: "Casa · 80 Inverness Terrace"})
    .bindTooltip("Casa · 80 Inverness Terrace", {direction: "top", offset: [0, -14], className: "tip"}).addTo(marks);
  days.forEach(function(d){
    d.stops.forEach(function(s){
      if (s.home) return;
      if (!full && s.alt) return;
      var act = state.active === s.id;
      var mk = L.marker([s.lat, s.lon], {icon: pinIcon(s, full), title: (full && s.num ? s.num + ". " : "") + s.name, alt: s.name, riseOnHover: true, zIndexOffset: act ? 1000 : (s.alt ? -50 : 0)});
      mk.on("click", function(){ if (state.view === "todo") go(s.day.id, s.id, true); else setActive(s.id, true); });
      if (full) mk.bindTooltip(esc(s.short || s.name), {permanent: act, direction: "auto", offset: [act ? 18 : 14, 0], className: "tip"});
      mk.addTo(marks);
    });
  });
}

/* ---------- Lista ---------- */
var HOUSE = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 7.5 8 1.8l6.5 5.7V14.5H10V10H6v4.5H1.5z" fill="currentColor"/></svg>';
var MODE = {metro:"Metro", tren:"Tren", pie:"A pie", tour:"Free tour"};

function stopHTML(s, prev){
  var isDone = done.indexOf(s.id) >= 0, h = [];
  h.push('<li class="stop' + (isDone ? " done" : "") + (state.active === s.id ? " is-active" : "") + '" data-stop="' + s.id + '">');
  if (s.leg && !s.alt) h.push('<div class="leg"><span class="mode ' + s.leg.m + '">' + MODE[s.leg.m] + '</span><span>' + esc(s.leg.txt) + '</span>' + (s.leg.cost ? '<span class="cost">' + esc(s.leg.cost) + '</span>' : '') + '</div>');
  var cls = "badge" + (s.home ? " home" : "") + (s.xmas ? " xmas" : "") + (s.alt ? " alt" : "");
  h.push('<span class="' + cls + '" aria-hidden="true">' + (s.home ? HOUSE : (isDone && !s.alt ? "✓" : s.num)) + '</span>');
  h.push('<article class="card"><div class="meta"><time>' + esc(s.t) + '</time>');
  if (s.xmas) h.push('<span class="chip xmas">Navidad</span>');
  if (s.res) h.push('<span class="chip res">' + esc(s.res) + '</span>');
  if (s.opt) h.push('<span class="chip opt">Opcional</span>');
  if (s.alt) h.push('<span class="chip opt">Alternativa</span>');
  h.push('</div><h3>' + esc(s.home ? "Casa" : s.name) + '</h3>');
  if (s.desc) h.push('<p>' + esc(s.desc) + '</p>');
  h.push('<div class="links"><a href="' + mapsUrl(s) + '">Abrir en Google Maps</a>');
  if (s.book) h.push('<a class="book" href="' + s.book + '">' + esc(s.bookLabel || "Reservar") + '</a>');
  if (prev && !s.alt){
    var mode = (s.leg && (s.leg.m === "pie" || s.leg.m === "tour")) ? "walking" : "transit";
    if (!(prev.lat === s.lat && prev.lon === s.lon)) h.push('<a href="' + dirUrl(prev, s, mode) + '">Cómo llegar</a>');
  }
  if (!s.home) h.push('<a href="' + photosUrl(s) + '">Fotos</a>');
  if (!s.home && !s.alt) h.push('<button type="button" class="done-btn" data-done="' + s.id + '" aria-pressed="' + isDone + '">' + (isDone ? "Hecho" : "Marcar como hecho") + '</button>');
  h.push('</div></article></li>');
  return h.join("");
}

function renderList(){
  var el = document.getElementById("list"), h = [];
  if (state.view === "todo"){
    h.push('<section class="intro"><h2>Cinco días, cinco líneas</h2><p>Cada día es una línea de color en el mapa. Abre un día para ver sus paradas en orden, con el transporte y lo que cuesta cada trayecto por persona.</p></section>');
    h.push('<div class="daycards">');
    DAYS.forEach(function(d){
      var n = d.stops.filter(function(s){ return !s.home && !s.alt; }).length;
      var x = d.stops.filter(function(s){ return s.xmas && !s.alt; }).length;
      h.push('<button type="button" class="daycard" data-go="' + d.id + '" style="--c:var(' + d.c + ')"><span class="dc-top"><svg width="30" height="10" aria-hidden="true"><line x1="2" y1="5" x2="28" y2="5" stroke="var(' + d.c + ')" stroke-width="4" stroke-linecap="round"/><circle cx="15" cy="5" r="4" fill="var(' + d.c + ')" stroke="var(--surface)" stroke-width="1.5"/></svg>' + d.short + '</span><span class="dc-title">' + esc(d.theme) + '</span><span class="dc-meta">' + n + ' paradas · ' + (x ? x + ' navideñas · ' : '') + 'transporte ' + d.cost + '</span></button>');
    });
    h.push('</div>');
    h.push('<section class="block"><h3 class="sec">Reservas y trámites</h3><p class="checknote">Gratis pero con reserva para no hacer cola: Horizon 22 y el Museo de Historia Natural. Sin reservar: National Gallery, Tate Modern, mercados y luces.</p><ul class="checks">');
    CHECKS.forEach(function(c){
      var on = checks.indexOf(c[0]) >= 0;
      h.push('<li><label for="chk-' + c[0] + '"><input type="checkbox" id="chk-' + c[0] + '" data-check="' + c[0] + '"' + (on ? " checked" : "") + '><span>' + esc(c[1]) + '</span><span class="when">' + esc(c[2]) + '</span></label></li>');
    });
    h.push('</ul></section>');
    h.push('<section class="block"><h3 class="sec">Gasto estimado por persona</h3><table class="budget"><tbody>' +
      '<tr><td>Transporte<span class="sub">Aeropuertos incluidos; con contactless y tope diario</span></td><td class="n">£50,50</td></tr>' +
      '<tr><td>Entradas con precio de estudiante<span class="sub">Abadía, Torre y Winter Wonderland</span></td><td class="n">£63</td></tr>' +
      '<tr><td>Propina del free tour</td><td class="n">£10–15</td></tr>' +
      '<tr><td>Comida y bebida<span class="sub">£30–40 al día, desayunos en casa</span></td><td class="n">£135–180</td></tr>' +
      '<tr><td>ETA<span class="sub">Si aún no la tenéis</span></td><td class="n">£20</td></tr>' +
      '<tr class="total"><td>Total aproximado</td><td class="n">£283–328<span class="sub">≈ €330–385</span></td></tr>' +
      '</tbody></table></section>');
    h.push('<p class="foot">Las casillas y las paradas hechas se guardan en el navegador donde abras esta página.</p>');
  } else {
    var d = dayById(state.view);
    h.push('<header class="dayhead" style="--c:var(' + d.c + ')"><p class="eyebrow">' + esc(d.long) + '</p><h2>' + esc(d.theme) + '</h2>');
    h.push('<div class="facts"><span class="fact">Transporte <b>' + d.cost + '</b> por persona · ' + esc(d.costNote) + '</span><span class="fact">Reservas: ' + esc(d.reservas) + '</span></div>');
    h.push('<a class="btn" href="' + dayRouteUrl(d) + '">Abrir la ruta del día en Google Maps ↗</a></header>');
    h.push('<ol class="stops" style="--c:var(' + d.c + ')">');
    var prev = null;
    d.stops.forEach(function(s){ if (s.alt) return; h.push(stopHTML(s, prev)); prev = s; });
    h.push('</ol>');
    var alts = d.stops.filter(function(s){ return s.alt; });
    if (alts.length){
      h.push('<section class="alts"><h3 class="sec">Alternativas</h3><ol class="stops" style="--c:var(' + d.c + ')">');
      alts.forEach(function(s){ h.push(stopHTML(s, null)); });
      h.push('</ol></section>');
    }
    var i = DAYS.indexOf(d), nx = DAYS[i + 1];
    h.push('<p class="foot">' + (nx ? '<button type="button" class="btn" data-go="' + nx.id + '">Siguiente: ' + nx.short + ' →</button>' : '<button type="button" class="btn" data-go="todo">Ver el viaje completo</button>') + '</p>');
  }
  el.innerHTML = h.join("");
}

function renderTabs(){
  var t = ['<button type="button" class="tab" data-go="todo" style="--c:var(--fg)" aria-current="' + (state.view === "todo") + '">Todo el viaje</button>'];
  DAYS.forEach(function(d){ t.push('<button type="button" class="tab" data-go="' + d.id + '" style="--c:var(' + d.c + ')" aria-current="' + (state.view === d.id) + '"><span class="dot"></span>' + d.short + '</button>'); });
  document.getElementById("tabs").innerHTML = t.join("");
  var cur = document.querySelector('.tab[aria-current="true"]');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({block: "nearest", inline: "nearest"});
}

/* ---------- Navegación ---------- */
function go(view, active, scroll){
  if (view !== "todo" && !dayById(view)) view = "todo";
  var changed = state.view !== view;
  state.view = view; state.active = active || null;
  if (location.hash !== "#" + view){ try{ history.replaceState(null, "", "#" + view); }catch(e){ location.hash = view; } }
  renderTabs(); renderList();
  draw();
  if (changed || !active) fitView(mapReady);
  mapReady = true;
  if (changed && !active){ var top = document.querySelector(".layout"); if (top && window.scrollY > top.offsetTop) window.scrollTo({top: top.offsetTop - 8, behavior: reduce ? "auto" : "smooth"}); }
  if (active && scroll) scrollToStop(active);
}
function setActive(id, scroll){
  state.active = id;
  document.querySelectorAll(".stop").forEach(function(li){ li.classList.toggle("is-active", li.getAttribute("data-stop") === id); });
  draw();
  focusStop(findStop(id));
  if (scroll) scrollToStop(id);
}
function ensureMapVisible(){
  if (window.innerWidth >= 920) return;
  var m = document.getElementById("map"), r = m.getBoundingClientRect();
  if (r.bottom < 60 || r.top > window.innerHeight - 60) m.scrollIntoView({block: "start", behavior: reduce ? "auto" : "smooth"});
}
function scrollToStop(id){ var li = document.querySelector('[data-stop="' + id + '"]'); if (li) li.scrollIntoView({block: "start", behavior: reduce ? "auto" : "smooth"}); }

document.addEventListener("click", function(e){
  var t = e.target;
  var goEl = t.closest("[data-go]"); if (goEl){ go(goEl.getAttribute("data-go")); return; }
  var dn = t.closest("[data-done]");
  if (dn){
    var id = dn.getAttribute("data-done"), i = done.indexOf(id);
    if (i >= 0) done.splice(i, 1); else done.push(id);
    save("londres-hechos", done); renderList(); draw(); return;
  }
  if (t.closest("a") || t.closest(".leaflet-container")) return;
  var li = t.closest("[data-stop]"); if (li){ setActive(li.getAttribute("data-stop"), false); ensureMapVisible(); }
});
document.addEventListener("change", function(e){
  var c = e.target.getAttribute && e.target.getAttribute("data-check"); if (!c) return;
  var i = checks.indexOf(c);
  if (e.target.checked && i < 0) checks.push(c); if (!e.target.checked && i >= 0) checks.splice(i, 1);
  save("londres-reservas", checks);
});
window.addEventListener("hashchange", function(){ var v = location.hash.slice(1); if (v && v !== state.view) go(v); });
initMap();

/* ---------- Cuenta atrás ---------- */
var today;
try { today = new Intl.DateTimeFormat("en-CA", {timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date()); } catch(e){ today = new Date().toISOString().slice(0, 10); }
var diff = Math.round((Date.parse("2026-11-18") - Date.parse(today)) / 864e5), todayDay = null;
DAYS.forEach(function(d, i){ if (d.date === today) todayDay = {d: d, i: i}; });
var countEl = document.getElementById("count");
if (todayDay) countEl.textContent = "Hoy: día " + (todayDay.i + 1) + " de 5";
else if (diff > 1) countEl.textContent = "Faltan " + diff + " días";
else if (diff === 1) countEl.textContent = "Salís mañana";
else countEl.textContent = "Viaje terminado";

var start = location.hash.slice(1);
go(start && (start === "todo" || dayById(start)) ? start : (todayDay ? todayDay.d.id : "todo"));
})();
</script>

</body>
</html>
