<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mapa del viaje a Londres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: mapa esquemático fijo (izquierda en escritorio, arriba en móvil) + itinerario dibujado como una línea de metro */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --fg:#17212B; --muted:#5A6672; --rule:#D7DDE4; --chip:#E8ECF0;
  --land:#E8ECF0; --river:#B3CDE4; --park:#CFE2C7; --grid:#D9DFE5;
  --gold:#B07414; --gold-soft:#F6E6C4; --gold-ink:#6E4508; --on-line:#FFFFFF; --focus:#2C67AA;
  --d1:#C4413A; --d2:#2C67AA; --d3:#7646AE; --d4:#1C8466; --d5:#C2691A;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#151D26; --fg:#E5EAF0; --muted:#94A1AF; --rule:#283442; --chip:#1F2833;
    --land:#121A23; --river:#1C3954; --park:#183023; --grid:#1B2530;
    --gold:#E2AE4A; --gold-soft:#3A2E17; --gold-ink:#F1CF86; --on-line:#0E141B; --focus:#6FA4E2;
    --d1:#E86A61; --d2:#5E99DC; --d3:#A47FDB; --d4:#3EBB95; --d5:#E69C50;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#151D26; --fg:#E5EAF0; --muted:#94A1AF; --rule:#283442; --chip:#1F2833;
  --land:#121A23; --river:#1C3954; --park:#183023; --grid:#1B2530;
  --gold:#E2AE4A; --gold-soft:#3A2E17; --gold-ink:#F1CF86; --on-line:#0E141B; --focus:#6FA4E2;
  --d1:#E86A61; --d2:#5E99DC; --d3:#A47FDB; --d4:#3EBB95; --d5:#E69C50;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
.wrap{max-width:1280px; margin:0 auto; padding-block:20px 48px}

header.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 24px; padding-bottom:14px}
.top .dates{font-family:var(--f-mono); font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
.top h1{font-family:var(--f-display); font-weight:400; font-size:clamp(36px, 6vw, 56px); line-height:1; margin:0; letter-spacing:-.01em; text-wrap:balance}
.top .home{margin:8px 0 0; color:var(--muted)}
.count{font-family:var(--f-mono); font-size:13px; border:1px solid var(--rule); background:var(--surface); border-radius:999px; padding:6px 12px; white-space:nowrap}

.layout{display:grid; gap:18px; grid-template-columns:minmax(0, 1fr)}
.panel{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding-block:8px; display:flex; flex-direction:column; gap:10px; min-width:0}
.tabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; font:600 13px/1 var(--f-body); color:var(--fg); background:var(--surface); border:1px solid var(--rule); border-radius:999px; padding:9px 13px; cursor:pointer}
.tab .dot{width:10px; height:10px; border-radius:50%; background:var(--c)}
.tab[aria-current="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.tab:hover{border-color:var(--fg)}
.map{position:relative; height:38vh; height:38svh; min-height:230px; border:1px solid var(--rule); border-radius:12px; overflow:hidden; background:var(--land)}
.map svg{display:block; width:100%; height:100%}
.mk{cursor:pointer; outline:none}
.mk:focus-visible circle, .mk:focus-visible rect{stroke:var(--focus); stroke-width:3}
.legend{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}

button, a{font-family:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

.list{min-width:0}
.dayhead .eyebrow{font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.09em; font-size:12px; color:var(--c); margin:0; font-weight:500}
.dayhead h2{font-family:var(--f-display); font-weight:400; font-size:clamp(24px, 3.4vw, 30px); line-height:1.15; margin:4px 0 12px; text-wrap:balance}
.facts{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.fact{font-size:13px; background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:6px 10px}
.fact b{font-family:var(--f-mono); font-weight:500}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--fg); color:var(--fg); background:transparent; border-radius:999px; padding:8px 14px; text-decoration:none; font-weight:600; font-size:13px; cursor:pointer}
.btn:hover{background:var(--fg); color:var(--bg)}

.stops{list-style:none; margin:22px 0 0; padding:0; position:relative}
.stops::before{content:""; position:absolute; left:18px; top:34px; bottom:34px; width:4px; border-radius:2px; background:var(--c)}
.stop{display:grid; grid-template-columns:40px minmax(0, 1fr); grid-template-areas:". leg" "badge card"; column-gap:12px; scroll-margin-top:calc(38svh + 120px)}
.leg{grid-area:leg; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--muted); padding:9px 0}
.mode{font:600 10.5px/1 var(--f-body); letter-spacing:.07em; text-transform:uppercase; border-radius:4px; padding:4px 6px}
.mode.metro, .mode.tren{background:var(--c); color:var(--on-line)}
.mode.pie, .mode.tour{border:1.5px dashed var(--c); color:var(--fg)}
.leg .cost{margin-left:auto; font-family:var(--f-mono); color:var(--fg); font-weight:500; font-variant-numeric:tabular-nums}
.badge{grid-area:badge; align-self:start; justify-self:center; margin-top:10px; width:34px; height:34px; border-radius:50%; background:var(--c); color:var(--on-line); display:grid; place-items:center; font:700 14px/1 var(--f-body); box-shadow:0 0 0 4px var(--bg); position:relative; z-index:1; font-variant-numeric:tabular-nums}
.badge.home{background:var(--fg); color:var(--bg); border-radius:9px}
.badge.xmas{box-shadow:0 0 0 3px var(--bg), 0 0 0 5.5px var(--gold), 0 0 0 8px var(--bg)}
.badge.alt{background:var(--surface); color:var(--fg); border:2px dashed var(--c)}
.stop.done .badge:not(.home){background:var(--muted)}
.card{grid-area:card; background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:12px 14px; cursor:pointer; min-width:0; transition:border-color .15s}
.card:hover{border-color:var(--muted)}
.stop.is-active .card{border-color:var(--c); box-shadow:0 0 0 1px var(--c)}
.meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px}
.meta time{font-family:var(--f-mono); font-size:13px; font-weight:500; font-variant-numeric:tabular-nums}
.chip{font-size:11.5px; font-weight:600; border-radius:999px; padding:3px 8px; background:var(--chip); color:var(--fg); line-height:1.3}
.chip.xmas{background:var(--gold-soft); color:var(--gold-ink)}
.chip.res{background:transparent; border:1px solid var(--c)}
.chip.opt{background:transparent; border:1px dashed var(--muted); color:var(--muted)}
.card h3{font-size:17px; font-weight:700; margin:6px 0 4px; line-height:1.25; text-wrap:balance}
.card p{margin:0; color:var(--muted); max-width:62ch}
.stop.done .card h3{text-decoration:line-through; text-decoration-color:var(--muted)}
.links{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.links a, .done-btn{font-size:12.5px; font-weight:600; color:var(--fg); text-decoration:none; border:1px solid var(--rule); border-radius:8px; padding:6px 10px; background:var(--bg); cursor:pointer; line-height:1.2}
.links a:hover, .done-btn:hover{border-color:var(--fg)}
.done-btn[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.alts{margin-top:28px}
.alts h3.sec, .sec{font-family:var(--f-mono); font-size:12px; font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
.alts .stops{margin-top:0}
.alts .stops::before{display:none}
.alts .stop{grid-template-areas:"badge card"; margin-bottom:10px}

.intro h2{font-family:var(--f-display); font-weight:400; font-size:clamp(24px, 3.4vw, 30px); line-height:1.15; margin:0 0 8px}
.intro p{margin:0 0 18px; color:var(--muted); max-width:60ch}
.daycards{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap:10px}
.daycard{text-align:left; background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:14px; cursor:pointer; color:var(--fg); display:flex; flex-direction:column; gap:6px; font:inherit}
.daycard:hover{border-color:var(--c)}
.dc-top{display:flex; align-items:center; gap:10px; font-family:var(--f-mono); font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.dc-title{font-weight:700; font-size:15.5px; line-height:1.3}
.dc-meta{font-size:13px; color:var(--muted)}
section.block{margin-top:30px}
.checks{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.checks label{display:flex; align-items:flex-start; gap:10px; padding:8px 4px; border-bottom:1px solid var(--rule); cursor:pointer}
.checks input{margin-top:3px; width:16px; height:16px; accent-color:var(--fg); flex:none}
.checks .when{font-family:var(--f-mono); font-size:12.5px; color:var(--muted); margin-left:auto; white-space:nowrap; padding-left:8px}
.checks input:checked + span{color:var(--muted); text-decoration:line-through}
.budget{width:100%; border-collapse:collapse; font-size:14px}
.budget td{padding:8px 0; border-bottom:1px solid var(--rule); vertical-align:top}
.budget td.n{text-align:right; font-family:var(--f-mono); white-space:nowrap; padding-left:12px; font-variant-numeric:tabular-nums}
.budget tr.total td{font-weight:700; border-bottom:none; padding-top:12px}
.budget .sub{display:block; color:var(--muted); font-size:12.5px}
.foot{margin-top:28px; font-size:13px; color:var(--muted)}
.foot a{color:var(--fg)}

@media (min-width:920px){
  .layout{grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); align-items:start; gap:28px}
  .panel{top:calc(env(safe-area-inset-top, 0px) + 12px); height:calc(100svh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); padding-block:0}
  .map{flex:1; height:auto; min-height:360px}
  .stop{scroll-margin-top:16px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; scroll-behavior:auto !important} }
</style>
</head>

function dayById(id){ for (var i = 0; i < DAYS.length; i++) if (DAYS[i].id === id) return DAYS[i]; return null; }

/* ---------- Encuadre ---------- */
function mapSize(){ var m = document.getElementById("map"); return {w: m.clientWidth || 600, h: m.clientHeight || 400}; }
function fitBox(b){
  var sz = mapSize(), a = sz.w / sz.h;
  var w = b.x1 - b.x0, h = b.y1 - b.y0;
  var pad = Math.max(w, h) * 0.12 + 34;
  w += pad * 2; h += pad * 2; w = Math.max(w, 230); h = Math.max(h, 150);
  if (w / h < a) w = h * a; else h = w / a;
  var cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  return {x: cx - w / 2, y: cy - h / 2, w: w, h: h};
}
function targetVB(){
  if (state.view === "todo"){
    var sz = mapSize(), a = sz.w / sz.h, w = B.W, h = B.H;
    if (w / h < a) w = h * a; else h = w / a;
    return {x: B.W / 2 - w / 2, y: B.H / 2 - h / 2, w: w, h: h};
  }
  var d = dayById(state.view), b = {x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity};
  function add(x, y){ b.x0 = Math.min(b.x0, x); b.y0 = Math.min(b.y0, y); b.x1 = Math.max(b.x1, x); b.y1 = Math.max(b.y1, y); }
  d.stops.forEach(function(s, i){
    if (!s.off){ var p = P(s.lat, s.lon); add(p[0], p[1]); return; }
    var nb = s.alt ? P(CASA.lat, CASA.lon) : (i > 0 && !d.stops[i-1].off ? P(d.stops[i-1].lat, d.stops[i-1].lon) : P(d.stops[i+1].lat, d.stops[i+1].lon));
    if (s.off === "s") add(nb[0], nb[1] + 70);
    if (s.off === "w") add(nb[0] - 110, nb[1]);
    if (s.off === "ne") add(nb[0] + 60, nb[1] - 60);
  });
  return fitBox(b);
}
function goVB(target){
  cancelAnimationFrame(state.anim);
  if (!state.vb || reduce){ state.vb = target; draw(); return; }
  var from = state.vb, t0 = performance.now(), dur = 520;
  function step(now){
    var t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    state.vb = {x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e, w: from.w + (target.w - from.w) * e, h: from.h + (target.h - from.h) * e};
    draw();
    if (t < 1) state.anim = requestAnimationFrame(step);
  }
  state.anim = requestAnimationFrame(step);
}

/* ---------- Dibujo ---------- */
function pts(list){ return list.map(function(p){ var q = P(p[0], p[1]); return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "); }
function offPos(s, anchor, vb, k){
  var arrow = s.off === "s" ? "↓ " : s.off === "w" ? "← " : "↗ ";
  var label = arrow + s.offLabel, wpx = label.length * 6.6 + 22, w = wpx * k, h = 22 * k, x, y;
  var clamp = function(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); };
  if (s.off === "s"){ x = clamp(anchor[0], vb.x + w / 2 + 10 * k, vb.x + vb.w - w / 2 - 10 * k); y = vb.y + vb.h - h / 2 - 12 * k; }
  else if (s.off === "w"){ x = vb.x + w / 2 + 10 * k; y = clamp(anchor[1], vb.y + h, vb.y + vb.h - h); }
  else { x = vb.x + vb.w - w / 2 - 10 * k; y = vb.y + h / 2 + 12 * k; }
  return {x: x, y: y, wpx: wpx, label: label};
}
function geometry(d, vb, k){
  var out = [];
  d.stops.forEach(function(s){ if (!s.off){ var p = P(s.lat, s.lon); out.push({s: s, x: p[0], y: p[1]}); } else out.push({s: s, off: true}); });
  out.forEach(function(g, i){
    if (!g.off) return;
    var nb;
    if (g.s.alt) nb = P(CASA.lat, CASA.lon);
    else { var prev = out[i-1], next = out[i+1]; var a = (prev && !prev.off && !prev.s.alt) ? prev : next; nb = [a.x, a.y]; }
    var o = offPos(g.s, nb, vb, k); g.x = o.x; g.y = o.y; g.wpx = o.wpx; g.label = o.label;
  });
  return out;
}

function draw(){
  var vb = state.vb, sz = mapSize(), k = vb.w / sz.w, o = [];
  o.push('<svg viewBox="' + [vb.x, vb.y, vb.w, vb.h].map(function(v){ return v.toFixed(2); }).join(" ") + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa esquemático de Londres con la ruta">');

      var txtCol = s.alt ? "var(--fg)" : "var(--on-line)";
      o.push('<g class="mk" data-id="' + s.id + '" tabindex="0" role="button" aria-label="' + esc(s.num + ". " + s.name) + '" transform="translate(' + p.x + ' ' + p.y + ') scale(' + k + ')">' +
        (s.xmas ? '<circle r="' + (r + 4) + '" fill="var(--land)" stroke="var(--gold)" stroke-width="2"/>' : '') +
        '<circle r="' + r + '" fill="' + fill + '" stroke="' + (s.alt ? col : "var(--land)") + '" stroke-width="2"' + (s.alt ? ' stroke-dasharray="3 2.5"' : '') + '/>' +
        '<text text-anchor="middle" y="' + (active ? 4.5 : 3.8) + '" font-size="' + (active ? 13 : 11) + '" font-weight="700" fill="' + txtCol + '" font-family="var(--f-body)">' + (isDone && !s.alt ? "✓" : s.num) + '</text></g>');
    });
  });

  // etiqueta de la parada activa
  if (full && state.active){
    var s = findStop(state.active);
    if (s && !s.off && !s.home){
      var p2 = P(s.lat, s.lon), name = s.short || s.name;
      var right = p2[0] + 20 * k + name.length * 7 * k < vb.x + vb.w;
      o.push('<g transform="translate(' + p2[0] + ' ' + p2[1] + ') scale(' + k + ')" pointer-events="none"><text x="' + (right ? 19 : -19) + '" y="4.5" text-anchor="' + (right ? "start" : "end") + '" font-size="13" font-weight="700" fill="var(--fg)" stroke="var(--land)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="var(--f-body)">' + esc(name) + '</text></g>');
    }
  }

  // escala y norte
  var len = vb.w < 420 ? KM / 2 : KM, lab = vb.w < 420 ? "500 m" : "1 km";
  var sx = vb.x + vb.w - 16 * k - len, sy = vb.y + vb.h - 16 * k;
  o.push('<g stroke="var(--fg)" stroke-width="' + (1.5 * k) + '" opacity=".7"><line x1="' + sx + '" y1="' + sy + '" x2="' + (sx + len) + '" y2="' + sy + '"/><line x1="' + sx + '" y1="' + (sy - 4 * k) + '" x2="' + sx + '" y2="' + sy + '"/><line x1="' + (sx + len) + '" y1="' + (sy - 4 * k) + '" x2="' + (sx + len) + '" y2="' + sy + '"/></g>');
  o.push('<g transform="translate(' + (sx + len / 2) + ' ' + (sy - 7 * k) + ') scale(' + k + ')"><text text-anchor="middle" font-size="10.5" fill="var(--fg)" opacity=".75" font-family="var(--f-mono)">' + lab + '</text></g>');
  o.push('<g transform="translate(' + (vb.x + 18 * k) + ' ' + (vb.y + 22 * k) + ') scale(' + k + ')" opacity=".7"><path d="M0 -10 5 4 0 1 -5 4Z" fill="var(--fg)"/><text y="16" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fg)" font-family="var(--f-mono)">N</text></g>');
  o.push('</svg>');
  document.getElementById("map").innerHTML = o.join("");
}

/* ---------- Lista ---------- */
var HOUSE = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 7.5 8 1.8l6.5 5.7V14.5H10V10H6v4.5H1.5z" fill="currentColor"/></svg>';
var MODE = {metro:"Metro", tren:"Tren", pie:"A pie", tour:"Free tour"};

function stopHTML(s, prev){
  var isDone = done.indexOf(s.id) >= 0, h = [];
  h.push('<li class="stop' + (isDone ? " done" : "") + (state.active === s.id ? " is-active" : "") + '" data-stop="' + s.id + '">');
  if (s.leg && !s.alt) h.push('<div class="leg"><span class="mode ' + s.leg.m + '">' + MODE[s.leg.m] + '</span><span>' + esc(s.leg.txt) + '</span>' + (s.leg.cost ? '<span class="cost">' + esc(s.leg.cost) + '</span>' : '') + '</div>');
  var cls = "badge" + (s.home ? " home" : "") + (s.xmas ? " xmas" : "") + (s.alt ? " alt" : "");
  h.push('<span class="' + cls + '" aria-hidden="true">' + (s.home ? HOUSE : (isDone && !s.alt ? "✓" : s.num)) + '</span>');
  h.push('<article class="card"><div class="meta"><time>' + esc(s.t) + '</time>');
  if (s.xmas) h.push('<span class="chip xmas">Navidad</span>');
  if (s.res) h.push('<span class="chip res">' + esc(s.res) + '</span>');
  if (s.opt) h.push('<span class="chip opt">Opcional</span>');
  if (s.alt) h.push('<span class="chip opt">Alternativa</span>');
  h.push('</div><h3>' + esc(s.home ? "Casa" : s.name) + '</h3>');
  if (s.desc) h.push('<p>' + esc(s.desc) + '</p>');
  h.push('<div class="links"><a href="' + mapsUrl(s) + '">Abrir en Google Maps</a>');
  if (prev && !s.alt){
    var mode = (s.leg && (s.leg.m === "pie" || s.leg.m === "tour")) ? "walking" : "transit";
    if (!(prev.lat === s.lat && prev.lon === s.lon)) h.push('<a href="' + dirUrl(prev, s, mode) + '">Cómo llegar</a>');
  }
  if (!s.home) h.push('<a href="' + photosUrl(s) + '">Fotos</a>');
  if (!s.home && !s.alt) h.push('<button type="button" class="done-btn" data-done="' + s.id + '" aria-pressed="' + isDone + '">' + (isDone ? "Hecho" : "Marcar como hecho") + '</button>');
  h.push('</div></article></li>');
  return h.join("");
}

function renderList(){
  var el = document.getElementById("list"), h = [];
  if (state.view === "todo"){
    h.push('<section class="intro"><h2>Cinco días, cinco líneas</h2><p>Cada día es una línea de color en el mapa. Abre un día para ver sus paradas en orden, con el transporte y lo que cuesta cada trayecto por persona.</p></section>');
    h.push('<div class="daycards">');
    DAYS.forEach(function(d){
      var n = d.stops.filter(function(s){ return !s.home && !s.alt; }).length;
      var x = d.stops.filter(function(s){ return s.xmas && !s.alt; }).length;
      h.push('<button type="button" class="daycard" data-go="' + d.id + '" style="--c:var(' + d.c + ')"><span class="dc-top"><svg width="30" height="10" aria-hidden="true"><line x1="2" y1="5" x2="28" y2="5" stroke="var(' + d.c + ')" stroke-width="4" stroke-linecap="round"/><circle cx="15" cy="5" r="4" fill="var(' + d.c + ')" stroke="var(--surface)" stroke-width="1.5"/></svg>' + d.short + '</span><span class="dc-title">' + esc(d.theme) + '</span><span class="dc-meta">' + n + ' paradas · ' + (x ? x + ' navideñas · ' : '') + 'transporte ' + d.cost + '</span></button>');
    });
    h.push('</div>');
    h.push('<section class="block"><h3 class="sec">Reservas y trámites</h3><ul class="checks">');
    CHECKS.forEach(function(c){
      var on = checks.indexOf(c[0]) >= 0;
      h.push('<li><label for="chk-' + c[0] + '"><input type="checkbox" id="chk-' + c[0] + '" data-check="' + c[0] + '"' + (on ? " checked" : "") + '><span>' + esc(c[1]) + '</span><span class="when">' + esc(c[2]) + '</span></label></li>');
    });
    h.push('</ul></section>');
    h.push('<section class="block"><h3 class="sec">Gasto estimado por persona</h3><table class="budget"><tbody>' +
      '<tr><td>Transporte<span class="sub">Aeropuertos incluidos; con contactless y tope diario</span></td><td class="n">£47,60</td></tr>' +
      '<tr><td>Entradas con precio de estudiante<span class="sub">Abadía, Torre y Winter Wonderland</span></td><td class="n">£63</td></tr>' +
      '<tr><td>Propina del free tour</td><td class="n">£10–15</td></tr>' +
      '<tr><td>Comida y bebida<span class="sub">£30–40 al día, desayunos en casa</span></td><td class="n">£135–180</td></tr>' +
      '<tr><td>ETA<span class="sub">Si aún no la tenéis</span></td><td class="n">£20</td></tr>' +
      '<tr class="total"><td>Total aproximado</td><td class="n">£280–325<span class="sub">≈ €330–380</span></td></tr>' +
      '</tbody></table></section>');
    h.push('<p class="foot">Las casillas y las paradas hechas se guardan en el navegador donde abras este archivo.</p>');
  } else {
    var d = dayById(state.view);
    h.push('<header class="dayhead" style="--c:var(' + d.c + ')"><p class="eyebrow">' + esc(d.long) + '</p><h2>' + esc(d.theme) + '</h2>');
    h.push('<div class="facts"><span class="fact">Transporte <b>' + d.cost + '</b> por persona · ' + esc(d.costNote) + '</span><span class="fact">Reservas: ' + esc(d.reservas) + '</span></div>');
    h.push('<a class="btn" href="' + dayRouteUrl(d) + '">Abrir la ruta del día en Google Maps ↗</a></header>');
    h.push('<ol class="stops" style="--c:var(' + d.c + ')">');
    var prev = null;
    d.stops.forEach(function(s){ if (s.alt) return; h.push(stopHTML(s, prev)); prev = s; });
    h.push('</ol>');
    var alts = d.stops.filter(function(s){ return s.alt; });
    if (alts.length){
      h.push('<section class="alts"><h3 class="sec">Alternativas</h3><ol class="stops" style="--c:var(' + d.c + ')">');
      alts.forEach(function(s){ h.push(stopHTML(s, null)); });
      h.push('</ol></section>');
    }
    var i = DAYS.indexOf(d), nx = DAYS[i + 1];
    h.push('<p class="foot">' + (nx ? '<button type="button" class="btn" data-go="' + nx.id + '">Siguiente: ' + nx.short + ' →</button>' : '<button type="button" class="btn" data-go="todo">Ver el viaje completo</button>') + '</p>');
  }
  el.innerHTML = h.join("");
}

function renderTabs(){
  var t = ['<button type="button" class="tab" data-go="todo" style="--c:var(--fg)" aria-current="' + (state.view === "todo") + '">Todo el viaje</button>'];
  DAYS.forEach(function(d){ t.push('<button type="button" class="tab" data-go="' + d.id + '" style="--c:var(' + d.c + ')" aria-current="' + (state.view === d.id) + '"><span class="dot"></span>' + d.short + '</button>'); });
  document.getElementById("tabs").innerHTML = t.join("");
  var cur = document.querySelector('.tab[aria-current="true"]');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({block: "nearest", inline: "nearest"});
}

/* ---------- Navegación ---------- */
function go(view, active, scroll){
  if (view !== "todo" && !dayById(view)) view = "todo";
  var changed = state.view !== view;
  state.view = view; state.active = active || null;
  if (location.hash !== "#" + view){ try{ history.replaceState(null, "", "#" + view); }catch(e){ location.hash = view; } }
  renderTabs(); renderList();
  goVB(targetVB());
  if (changed && !active){ var top = document.querySelector(".layout"); if (top && window.scrollY > top.offsetTop) window.scrollTo({top: top.offsetTop - 8, behavior: reduce ? "auto" : "smooth"}); }
  if (active && scroll) scrollToStop(active);
}
function setActive(id, scroll){
  state.active = id;
  document.querySelectorAll(".stop").forEach(function(li){ li.classList.toggle("is-active", li.getAttribute("data-stop") === id); });
  draw();
  if (scroll) scrollToStop(id);
}
function ensureMapVisible(){
  if (window.innerWidth >= 920) return;
  var m = document.getElementById("map"), r = m.getBoundingClientRect();
  if (r.bottom < 60 || r.top > window.innerHeight - 60) m.scrollIntoView({block: "start", behavior: reduce ? "auto" : "smooth"});
}
function scrollToStop(id){ var li = document.querySelector('[data-stop="' + id + '"]'); if (li) li.scrollIntoView({block: "start", behavior: reduce ? "auto" : "smooth"}); }

document.addEventListener("click", function(e){
  var t = e.target;
  var goEl = t.closest("[data-go]"); if (goEl){ go(goEl.getAttribute("data-go")); return; }
  var dn = t.closest("[data-done]");
  if (dn){
    var id = dn.getAttribute("data-done"), i = done.indexOf(id);
    if (i >= 0) done.splice(i, 1); else done.push(id);
    save("londres-hechos", done); renderList(); draw(); return;
  }
  if (t.closest("a")) return;
  var mk = t.closest(".mk[data-id]");
  if (mk){
    var mid = mk.getAttribute("data-id"); if (mid === "casa") return;
    var s = findStop(mid);
    if (state.view === "todo" && s) go(s.day.id, mid, true); else setActive(mid, true);
    return;
  }
  var li = t.closest("[data-stop]"); if (li){ setActive(li.getAttribute("data-stop"), false); ensureMapVisible(); }
});
document.addEventListener("keydown", function(e){
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("mk")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", {bubbles: true})); }
});
document.addEventListener("change", function(e){
  var c = e.target.getAttribute && e.target.getAttribute("data-check"); if (!c) return;
  var i = checks.indexOf(c);
  if (e.target.checked && i < 0) checks.push(c); if (!e.target.checked && i >= 0) checks.splice(i, 1);
  save("londres-reservas", checks);
});
window.addEventListener("hashchange", function(){ var v = location.hash.slice(1); if (v && v !== state.view) go(v); });
if (window.ResizeObserver) new ResizeObserver(function(){ if (!state.vb) return; cancelAnimationFrame(state.anim); state.vb = targetVB(); draw(); }).observe(document.getElementById("map"));

/* ---------- Cuenta atrás ---------- */
var today;
try { today = new Intl.DateTimeFormat("en-CA", {timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date()); } catch(e){ today = new Date().toISOString().slice(0, 10); }
var diff = Math.round((Date.parse("2026-11-18") - Date.parse(today)) / 864e5), todayDay = null;
DAYS.forEach(function(d, i){ if (d.date === today) todayDay = {d: d, i: i}; });
var countEl = document.getElementById("count");
if (todayDay) countEl.textContent = "Hoy: día " + (todayDay.i + 1) + " de 5";
else if (diff > 1) countEl.textContent = "Faltan " + diff + " días";
else if (diff === 1) countEl.textContent = "Salís mañana";
else countEl.textContent = "Viaje terminado";

var start = location.hash.slice(1);
go(start && (start === "todo" || dayById(start)) ? start : (todayDay ? todayDay.d.id : "todo"));
})();
</script>

</body>
</html>
